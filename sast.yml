# =============================================================================
#  Workshop 2 — SAST : SonarQube + Semgrep
#  Emplacement obligatoire :  .github/workflows/sast.yml   (à la RACINE du dépôt)
#  Secrets à créer : Settings > Secrets and variables > Actions
#      SONAR_TOKEN      = squ_xxx   (SonarQube > My Account > Security)
#      SONAR_HOST_URL   = http://<IP-Lhoussaine>:9000   (ou https://sonarcloud.io)
# =============================================================================
name: SAST - SonarQube + Semgrep

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
permissions:
  contents: read
  security-events: write      # nécessaire pour publier le rapport Semgrep (SARIF)

jobs:

  # ---------------------------------------------------------------------------
  # 1) Compilation + tests (JDK 25 = version du projet)
  # ---------------------------------------------------------------------------
  build-test:
    name: Build & Test (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Afficher l'environnement (preuve pour le README)
        run: java -version && mvn -version

      - name: Compiler et tester
        run: mvn -B clean verify

      - name: Archiver les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/**

  # ---------------------------------------------------------------------------
  # 2) Coverage + analyse SonarQube (JDK 21 : JaCoCo 0.8.12 ne lit pas Java 25)
  # ---------------------------------------------------------------------------
  sonarqube:
    name: Coverage + SonarQube (JDK 21)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Installer JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Analyse SonarQube (avec coverage)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B -Pcoverage-java21 verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:4.2.0.3121:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.projectKey=workshop2-G8 \
            -Dsonar.projectName="Library Management G8" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Archiver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/**

  # ---------------------------------------------------------------------------
  # 3) Semgrep — scan SAST statique (léger, pas besoin de Maven)
  # ---------------------------------------------------------------------------
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan Semgrep (JSON + SARIF)
        run: |
          semgrep --config=p/java \
                  --config=p/security-audit \
                  --config=p/owasp-top-ten \
                  --json --output=semgrep.json \
                  --sarif --output=semgrep.sarif \
                  --metrics=off \
                  src/ || true        # non bloquant : le rapport est produit même si findings

      - name: Compter les findings (preuve chiffrée)
        run: |
          echo "=== Nombre de findings ==="
          python3 -c "import json;d=json.load(open('semgrep.json'));print(len(d['results']))"

      - name: Archiver les rapports Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-reports
          path: |
            semgrep.json
            semgrep.sarif

      - name: Publier dans l'onglet Security (Code scanning)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
