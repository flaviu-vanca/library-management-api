name: library-management-cicd

services:
  sonar-db:
    image: postgres:16-alpine
    container_name: library-management-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:community
    container_name: library-management-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      sonar-db:
        condition: service_healthy

  webhook-relay:
    image: node:22-alpine
    container_name: library-management-webhook-relay
    restart: unless-stopped
    environment:
      SMEE_URL: ${SMEE_URL:-}
    command:
      - /bin/sh
      - -lc
      - >
        if [ -z "$SMEE_URL" ]; then
          echo "SMEE_URL is not set. Webhook relay is idle.";
          tail -f /dev/null;
        else
          npx --yes smee-client --url "$SMEE_URL" --target http://host.docker.internal:8080/github-webhook/;
        fi

volumes:
  sonar_db_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
